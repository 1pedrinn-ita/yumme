<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>Avaliar produto</title>
  <link rel="icon" href="../wp-content/uploads/2020/10/favicon.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../shop/css/shop.css">
</head>
<body class="page-solicitar page-avaliar">
  <div class="nav-progress" aria-hidden="true"></div>

  <header class="checkout-head">
    <div class="container checkout-head__inner">
      <button class="icon-btn" type="button" data-action="back" aria-label="Voltar">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <p class="checkout-head__title">Avaliar produto</p>
      <span></span>
    </div>
  </header>

  <main class="checkout">
    <div class="container review-page">
      <div class="card" data-mount="review-form">
        <div class="form-card">
          <span class="skeleton skeleton--title" style="width:60%"></span>
          <span class="skeleton skeleton--text" style="width:80%"></span>
          <span class="skeleton" style="height:88px;margin-top:18px;border-radius:14px"></span>
          <span class="skeleton" style="height:58px;margin-top:24px;border-radius:14px"></span>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-foot" data-mount="footer"></footer>

  <script src="../shop/js/config.js" defer></script>
  <script src="../shop/js/ui.js" defer></script>
  <script src="../shop/js/avaliar.js" defer></script>
</body>
</html>
