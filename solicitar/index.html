<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>Solicitar produto</title>
  <link rel="icon" href="../wp-content/uploads/2020/10/favicon.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../shop/css/shop.css">
</head>
<body class="page-solicitar">
  <div class="nav-progress" aria-hidden="true"></div>

  <header class="checkout-head">
    <div class="container checkout-head__inner">
      <button class="icon-btn" type="button" data-action="back" aria-label="Voltar ao produto">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <p class="checkout-head__title">Solicitar produto</p>
      <span></span>
    </div>
    <div class="checkout-head__secure">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Ambiente seguro · Seus dados estão protegidos
    </div>
  </header>

  <main class="checkout">
    <div class="container">
      <ol class="steps" data-mount="steps" aria-label="Etapas"></ol>

      <div class="checkout__grid">
        <aside class="checkout__aside card order" data-mount="order" aria-label="Resumo do pedido">
          <div style="padding:16px 18px">
            <span class="skeleton skeleton--text" style="width:50%"></span>
          </div>
        </aside>

        <div class="card" data-mount="form">
          <div class="form-card">
            <span class="skeleton skeleton--title" style="width:60%"></span>
            <span class="skeleton skeleton--text" style="width:80%"></span>
            <span class="skeleton" style="height:58px;margin-top:24px;border-radius:14px"></span>
            <span class="skeleton" style="height:58px;margin-top:12px;border-radius:14px"></span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-foot" data-mount="footer"></footer>

  <script src="../shop/js/config.js" defer></script>
  <script src="../shop/js/ui.js" defer></script>
  <script src="../shop/js/solicitar.js" defer></script>
</body>
</html>
